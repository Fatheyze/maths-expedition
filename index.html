<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths Expédition · Projet Z</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#071521;--panel:#102737;--edge:#31576a;--gold:#f6c75b;--sea:#0d6383;--mint:#6ee5c0;--text:#f4f7f9;--dim:#b4c8d4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1b4861,#071521 65%);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}header{padding:16px max(18px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff20;background:#071622d9;gap:12px}main{max-width:1160px;margin:25px auto;padding:0 18px 60px}h1,h2,h3{line-height:1.15}h1{font-size:clamp(32px,5vw,58px);margin:12px 0}h2{font-size:clamp(24px,3vw,35px)}p{color:var(--dim)}button,input,select{font:inherit}button{border:0;background:var(--gold);color:#09202c;font-weight:800;padding:12px 17px;border-radius:12px;cursor:pointer}button:hover{filter:brightness(1.09)}button:disabled{opacity:.42;cursor:not-allowed}button.secondary{background:#204255;color:#fff;border:1px solid #46778a}button.success{background:var(--mint)}input,select{width:100%;background:#071d2a;border:1px solid #648094;color:#fff;padding:13px;border-radius:10px}label{display:block;color:#c8dae1;margin:10px 0 5px}.panel{background:linear-gradient(145deg,#15364a,#0d2332);border:1px solid var(--edge);padding:clamp(18px,3vw,32px);border-radius:22px;box-shadow:0 18px 50px #0003;margin:18px 0}.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px}.eyebrow{letter-spacing:.17em;text-transform:uppercase;color:var(--mint);font-weight:800;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.muted{color:var(--dim)}.earth{width:min(100%,420px);aspect-ratio:1;border-radius:50%;margin:auto;background:radial-gradient(circle at 25% 20%,#ffffff66,transparent 27%),url('https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/The_Earth_seen_from_Apollo_17.jpg/600px-The_Earth_seen_from_Apollo_17.jpg') center/cover,#075d82;box-shadow:inset -35px -25px 75px #020e1f,0 0 0 2px #8fcfe777,0 0 75px #1597b333;animation:float 12s ease-in-out infinite alternate}@keyframes float{to{transform:rotate(6deg) translateY(-7px)}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.tile{background:#163b4e;border:1px solid #497082;border-radius:15px;padding:17px;text-align:left;color:white;min-height:130px}.tile.active{border-color:var(--gold);background:#29536a}.tile.done{border-color:var(--mint)}.tile strong{display:block;font-size:19px;margin:6px 0}.tag{display:inline-block;padding:4px 10px;border:1px solid #678596;border-radius:20px;font-size:12px;color:#d5e7ed}.progress{height:11px;background:#24485a;border-radius:20px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:linear-gradient(90deg,#36d6ad,#f7c659);transition:width .3s}.question{font-size:clamp(19px,2.6vw,27px);font-weight:700;padding:22px;background:#061c2a;border-left:4px solid var(--gold);border-radius:12px;margin:18px 0;white-space:pre-wrap}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answers button{min-height:75px;background:#1a465b;color:white;border:2px solid #55778a;text-align:left}.answers button.selected{border-color:var(--gold);background:#335b65}.feedback{padding:14px 18px;border-radius:12px;background:#154a40;margin:12px 0;color:#e7fff3}.feedback.bad{background:#63343d}.note{background:#183c4b;padding:18px;border-radius:12px;border-left:3px solid var(--mint);margin:16px 0;white-space:pre-line}.worldmap{height:380px;border-radius:18px;border:2px solid #6e8b99;overflow:hidden;background:#073146}.leaflet-popup-content-wrapper{background:#133b4b;color:white}.leaflet-popup-tip{background:#133b4b}.digits{display:flex;gap:10px;justify-content:center;margin:18px 0}.digit{width:52px;height:68px;background:#1b4051;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;font-size:30px;font-weight:900}.mini{font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.pill{padding:8px 13px;background:#1a4658;border-radius:30px;display:inline-block}.qrcard{background:white;color:#102333;text-align:center;border-radius:18px;padding:25px;max-width:520px;margin:20px auto}.qrcard img{width:min(300px,80%)}#printArea{display:none}@media(max-width:680px){.hero,.two{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.worldmap{height:290px}header{flex-wrap:wrap}}@media print{body>*{display:none!important}#printArea{display:grid!important;grid-template-columns:repeat(3,1fr);gap:8mm;padding:8mm;background:white;color:black}#printArea .labelqr{border:1px dashed #999;padding:6mm;text-align:center;break-inside:avoid;font:12px Arial}#printArea img{width:35mm;height:35mm}}
</style></head><body><header><div><strong>🌍 MATHS EXPÉDITION</strong> <span class="tag">PROJET Z · V2</span></div><div><button class="secondary" onclick="home()">Accueil</button> <button class="secondary" onclick="teacher()">Espace professeur</button></div></header><main id="app"></main><div id="printArea"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const C={"6e":["Nombres entiers et décimaux","Addition et soustraction","Multiplication et division","Fractions","Proportionnalité","Pourcentages","Durées et conversions","Périmètres et aires","Angles et constructions","Triangles et quadrilatères","Solides et volumes","Tableaux et graphiques"],"5e":["Priorités opératoires","Nombres relatifs","Fractions et opérations","Proportionnalité","Pourcentages et échelles","Calcul littéral","Équations simples","Triangles et angles","Symétrie centrale","Aires et volumes","Statistiques","Probabilités"],"4e":["Nombres relatifs et fractions","Puissances de dix","Calcul littéral et distributivité","Équations","Proportionnalité et pourcentages","Théorème de Pythagore","Théorème de Thalès","Translations et rotations","Cosinus","Statistiques","Probabilités","Volumes"],"3e":["Arithmétique et nombres premiers","Puissances et racines carrées","Calcul littéral et identités","Équations et inéquations","Fonctions","Fonctions affines","Théorème de Thalès","Théorème de Pythagore","Trigonométrie","Homothéties","Statistiques","Probabilités et algorithmique"]};const places=[['🏕️','Camp de base','Paris',48.8566,2.3522],['🏛️','Temple des nombres','Louxor',25.6872,32.6396],['🏙️','Cité perdue','Pétra',30.3285,35.4444],['🏔️','Passage des cimes','Himalaya',27.9881,86.925],['🌋','Volcan des secrets','Mont Fuji',35.3606,138.7274],['🗿','Sanctuaire final','Machu Picchu',-13.1631,-72.545]];const digits=[4,7,2,9,1,6];const el=document.getElementById('app');let session=JSON.parse(localStorage.getItem('expeditionZ_session_v2')||'null'),selected=null,attempts=0,questionIndex=0,stage=0,questions=[],answerOptions=[],started=0;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const mix=a=>a.map(x=>({x,k:Math.random()})).sort((a,b)=>a.k-b.k).map(v=>v.x);const save=()=>localStorage.setItem('expeditionZ_session_v2',JSON.stringify(session));const btn=(t,fn,cls='')=>'<button class="'+cls+'" onclick="'+fn+'">'+t+'</button>';
function home(){el.innerHTML='<div class="hero"><div><div class="eyebrow">Une aventure mathématique autour du monde</div><h1>Six destinations.<br>Une mission.</h1><p>Des problèmes concrets, des méthodes, des énigmes et un coffre à ouvrir. Une aventure conçue pour une séance de mathématiques d’environ une heure.</p><div class="actions">'+btn('🚀 Commencer la mission','setup()')+btn('🗺️ Reprendre','resume()','secondary')+btn('📱 QR code','qr()','secondary')+'</div></div><div class="earth" aria-label="Photographie de la Terre vue de l’espace"></div></div><div class="panel"><h3>Le message du professeur ZEGHOUDI</h3><p>« Agent, ton parcours sera différent selon ta classe et les chapitres choisis. Chaque destination contient une leçon, des défis et une énigme. Je compte sur ton raisonnement. »</p></div>'}
function setup(){el.innerHTML='<div class="panel"><div class="eyebrow">Préparation de la mission</div><h2>Choisis ton niveau et tes chapitres</h2><div class="two"><div><label>Classe</label><select id="grade" onchange="chapterUI()">'+Object.keys(C).map(g=>'<option>'+g+'</option>').join('')+'</select></div><div><label>Prénom</label><input id="first" placeholder="Prénom de l’élève"></div></div><label>Nom</label><input id="last" placeholder="Nom de l’élève"><div id="chapters"></div><div class="actions">'+btn('Lancer mon expédition','begin()')+'</div><p class="mini">Les données de cette version restent sur cet appareil. Le suivi en direct entre tablettes nécessite un serveur.</p></div>';chapterUI()}
function chapterUI(){let g=document.getElementById('grade').value;document.getElementById('chapters').innerHTML='<label>Chapitre principal</label><select id="ch1">'+C[g].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><label>Deuxième chapitre (facultatif)</label><select id="ch2"><option value="">Aucun</option>'+C[g].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>'}
function begin(){let first=document.getElementById('first').value.trim(),last=document.getElementById('last').value.trim();if(!first||!last){alert('Saisis le prénom et le nom.');return}let grade=document.getElementById('grade').value,ch1=document.getElementById('ch1').value,ch2=document.getElementById('ch2').value;session={first,last,grade,chapters:[ch1,...(ch2&&ch2!==ch1?[ch2]:[])],completed:0,solved:{},firstCorrect:0,tries:0,created:Date.now(),lastActive:Date.now()};save();map()}
function resume(){if(!session){setup();return}map()}
function map(){if(!session){setup();return}let n=session.completed;el.innerHTML='<div class="eyebrow">Agent '+esc(session.first)+' · '+esc(session.grade)+' · '+session.chapters.map(esc).join(' + ')+'</div><h2>Carte des six destinations</h2><p>Chaque trajet révèle une nouvelle zone. Ton professeur te transmettra un message à chaque escale.</p><div class="progress"><div style="width:'+(n/6*100)+'%"></div></div><div id="map" class="worldmap"></div><div class="grid" style="margin-top:20px">'+places.map((p,i)=>'<button class="tile '+(i<n?'done':i===n?'active':'')+'" '+(i>n?'disabled':'')+' onclick="enter('+i+')"><span class="tag">Étape '+(i+1)+(i<n?' ✓':i>n?' 🔒':' · À explorer')+'</span><strong>'+p[0]+' '+p[1]+'</strong><span>'+p[2]+'</span></button>').join('')+'</div><div class="panel"><h3>🔐 Les six fragments du coffre</h3><div class="digits">'+digits.map((d,i)=>'<div class="digit">'+(i<n?d:'?')+'</div>').join('')+'</div>'+(n===6?btn('Ouvrir le coffre','vault()'):'')+'</div>';renderMap(n)}
function renderMap(n){let e=document.getElementById('map');if(!window.L){e.textContent='Carte satellite disponible avec une connexion Internet.';return}let m=L.map(e,{scrollWheelZoom:false}).setView([22,20],2);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagerie © Esri, Maxar, Earthstar Geographics',maxZoom:15}).addTo(m);let pts=places.slice(0,Math.min(n+1,6));pts.forEach((p,i)=>L.circleMarker([p[3],p[4]],{radius:i===n?10:7,color:'#fff',weight:2,fillColor:i===n?'#f6c75b':'#51dfb3',fillOpacity:1}).addTo(m).bindPopup(p[1]+' · '+p[2]));if(pts.length>1){L.polyline(pts.map(p=>[p[3],p[4]]),{color:'#f6c75b',weight:3,dashArray:'9 7'}).addTo(m);m.fitBounds(pts.map(p=>[p[3],p[4]]),{padding:[45,45],maxZoom:4})}setTimeout(()=>m.invalidateSize(),200)}
function item(t,a,wrong,hint,why,type='Problème'){let vals=[String(a),...wrong.map(String)].filter((x,i,arr)=>arr.indexOf(x)===i);for(let k=0;vals.length<4;k++)vals.push(String(Number(a)+[2,5,7,11][k]));return{t,a:String(a),opts:mix(vals.slice(0,4)),hint,why,type}}
function bank(ch,level){let out=[],a=rnd(3,12),b=rnd(2,9),c=rnd(2,7),x=a*b,y=a+b,topic=ch.toLowerCase(),ctx=['Le camp commande du matériel','Une exploratrice relève les mesures','Le gardien du temple prépare une énigme','Une équipe organise son ravitaillement','Une carte indique un trajet','Un musée prépare une exposition'];let intro=ctx[rnd(0,5)]+'. ';
const add=(t,v,h,why,type)=>out.push(item(t,v,[v+1,v-1,v+Math.max(2,b)],h,why,type));
if(/fraction/.test(topic)){add(intro+'Une réserve contient '+(a*b)+' L. On utilise 1/'+b+' de la réserve. Combien de litres sont utilisés ?',a,'Divise la quantité totale par le dénominateur.',''+(a*b)+' ÷ '+b+' = '+a+' L.','Fraction d’une quantité');add('Quelle fraction de '+(a*b)+' représente '+a+' ?', '1/'+b,'Simplifie le rapport '+a+'/'+(a*b)+'.',''+a+'/'+(a*b)+' = 1/'+b+'.','Raisonnement');out.push(item('Calculer 1/'+b+' + 1/'+b+'.','2/'+b,['1/'+b,'1/'+(2*b),'2/'+(b*2)],'On additionne les numérateurs si les dénominateurs sont identiques.','1/'+b+' + 1/'+b+' = 2/'+b+'.','Cours appliqué'))}
else if(/pourcent|proportion|échelle/.test(topic)){add(intro+'Une carte coûte '+(a*10)+' €. Une réduction de 10 % est appliquée. Combien vaut la réduction ?',a,'10 % signifie un dixième.',''+(a*10)+' ÷ 10 = '+a+' €.','Situation concrète');add('Si '+b+' objets coûtent '+(a*b)+' €, combien coûtent 3 objets ?',3*a,'Trouve d’abord le prix d’un objet.','Un objet vaut '+a+' €, donc trois valent '+3*a+' €.','Proportionnalité');add('Sur un plan à l’échelle 1:100, '+b+' cm représentent combien de mètres ?',b,'100 cm = 1 m.',''+b+' cm × 100 = '+b+' m en réalité.','Échelle')}
else if(/pythagore/.test(topic)){out.push(item('Un triangle rectangle a des côtés de l’angle droit de 3 cm et 4 cm. Quelle est l’hypoténuse ?',5,[6,7,12],'Utilise 3² + 4² = c².','9 + 16 = 25, donc c = 5 cm.','Géométrie'));out.push(item('Un triangle de côtés 5, 12 et 13 est-il rectangle ?','Oui',['Non','Impossible','Seulement isocèle'],'Compare 5² + 12² et 13².','25 + 144 = 169 = 13².','Justification'));add('Un carré a un côté de '+a+' cm. Quelle est l’aire de son carré construit sur ce côté ?',a*a,'Aire d’un carré = côté × côté.',''+a+'² = '+a*a+' cm².','Préparation à Pythagore')}
else if(/thalès/.test(topic)){add('Deux triangles semblables ont un rapport d’agrandissement 2. Un côté mesure '+a+' cm sur le petit triangle. Sa longueur sur le grand ?',2*a,'Multiplie par le rapport.',''+a+' × 2 = '+2*a+' cm.','Thalès');add('Sur deux droites sécantes coupées par des parallèles, un segment de '+a+' cm devient '+(a*3)+' cm. Quel est le coefficient ?',3,'Rapport = grande longueur ÷ petite longueur.',''+(a*3)+' ÷ '+a+' = 3.','Rapports');add('Un segment de '+(a*2)+' cm est réduit avec un coefficient 0,5. Nouvelle longueur ?',a,'Multiplie par 0,5.',''+(a*2)+' × 0,5 = '+a+' cm.','Réduction')}
else if(/équation|littéral|fonction|identité|distribut/.test(topic)){add('Résoudre x + '+b+' = '+(a+b)+'. Quelle est la valeur de x ?',a,'Soustrais '+b+' aux deux membres.','x = '+(a+b)+' − '+b+' = '+a+'.','Équation');add('Une fonction associe à x le nombre 2x + 3. Image de '+a+' ?',2*a+3,'Remplace x par '+a+'.','2 × '+a+' + 3 = '+(2*a+3)+'.','Fonctions');add('Développer '+b+'(x + '+a+'). Quel est le terme constant ?',a*b,'Utilise la distributivité.',''+b+'x + '+(a*b)+'.','Calcul littéral')}
else if(/aire|périmètre|volume|solide|conversion|durée/.test(topic)){add('Un rectangle mesure '+a+' m de long et '+b+' m de large. Son périmètre ?',2*(a+b),'Additionne les quatre côtés.','2 × ('+a+' + '+b+') = '+2*(a+b)+' m.','Géométrie appliquée');add('Même rectangle : quelle est son aire ?',a*b,'Aire = longueur × largeur.',''+a+' × '+b+' = '+a*b+' m².','Grandeurs');add('Un pavé droit mesure '+a+' cm × '+b+' cm × 2 cm. Son volume ?',a*b*2,'Volume = longueur × largeur × hauteur.',''+a+' × '+b+' × 2 = '+a*b*2+' cm³.','Volumes')}
else if(/statistique|graphique|tableau|probabilit/.test(topic)){add('Une équipe relève '+a+', '+b+' et '+(a+b)+' points. Quelle est la moyenne ?',Math.round((2*(a+b))/3*100)/100,'Additionne les trois valeurs et divise par 3.','Somme = '+2*(a+b)+' ; moyenne ≈ '+(Math.round((2*(a+b))/3*100)/100)+'.','Données');add('Dans un sac, il y a '+a+' boules rouges et '+b+' bleues. Combien de boules au total ?',a+b,'Additionne les effectifs.',''+a+' + '+b+' = '+(a+b)+'.','Probabilités');add('Les effectifs sont 2, '+a+', 4. Quel est l’effectif total ?',a+6,'Additionne les effectifs.','2 + '+a+' + 4 = '+(a+6)+'.','Tableau')}
else if(/angle|triangle|quadrilatère|symétrie|rotation|translation|homothétie|cosinus|trigonométrie/.test(topic)){add('Dans un triangle, deux angles mesurent '+(a*5)+'° et '+(b*5)+'°. Troisième angle ?',180-5*(a+b),'La somme des angles d’un triangle est 180°.','180 − '+(a*5)+' − '+(b*5)+' = '+(180-5*(a+b))+'°.','Angles');add('Un angle droit mesure combien de degrés ?',90,'Rappelle-toi la définition d’un angle droit.','Un angle droit mesure 90°.','Cours');add('Un triangle isocèle a deux angles à la base de '+(a*5)+'°. Angle au sommet ?',180-10*a,'Deux angles à la base sont égaux.','180 − 2 × '+(a*5)+' = '+(180-10*a)+'°.','Raisonnement')}
else if(/puissance|racine|arithmétique|premier/.test(topic)){add('Quel est le carré de '+a+' ?',a*a,'Multiplie le nombre par lui-même.',''+a+' × '+a+' = '+a*a+'.','Puissances');add('Quelle est la racine carrée de '+(a*a)+' ?',a,'Cherche le nombre positif dont le carré vaut '+a*a+'.','√'+a*a+' = '+a+'.','Racines');add('Combien vaut 10³ ?',1000,'10³ = 10 × 10 × 10.','10³ = 1 000.','Notation scientifique')}
else if(/relatif/.test(topic)){add('Un plongeur est à −'+a+' m puis descend de '+b+' m. Quelle est sa profondeur ?',-(a+b),'Descendre revient à soustraire.','−'+a+' − '+b+' = −'+(a+b)+' m.','Nombres relatifs');add('La température passe de −'+b+' °C à '+a+' °C. De combien augmente-t-elle ?',a+b,'Calcule l’écart entre les deux températures.',''+a+' − (−'+b+') = '+(a+b)+' °C.','Situation réelle');add('Calculer (−'+a+') × (−'+b+').',a*b,'Le produit de deux nombres négatifs est positif.',''+a+' × '+b+' = '+a*b+'.','Règle de signes')}
else{add(intro+'On prépare '+a+' caisses de '+b+' objets et on ajoute '+c+' objets. Combien au total ?',a*b+c,'Effectue la multiplication avant l’addition.',''+a+' × '+b+' + '+c+' = '+(a*b+c)+'.','Situation concrète');add('Calculer '+(a*b)+' ÷ '+b+' + '+c+'.',a+c,'Division avant addition.',''+(a*b)+' ÷ '+b+' + '+c+' = '+(a+c)+'.','Calcul raisonné');add('Une équipe a '+(a+b)+' billets et en distribue '+b+'. Combien lui en reste-t-il ?',a,'Soustrais les billets distribués.',''+(a+b)+' − '+b+' = '+a+'.','Problème')}
out.push(item('Le professeur ZEGHOUDI demande : quelle est la première opération dans '+a+' + '+b+' × '+c+' ?',''+b+' × '+c,[a+' + '+b,a+' × '+b,b+' + '+c],'Multiplication avant addition.','On calcule '+b+' × '+c+' avant d’ajouter '+a+'.','Rappel méthodologique'));return out}
function makeStage(n){let all=[];session.chapters.forEach(ch=>{for(let j=0;j<5;j++)all.push(...bank(ch,session.grade))});all=mix(all);let seen=new Set;return all.filter(q=>{let k=q.t;if(seen.has(k))return false;seen.add(k);return true}).slice(0,8)}
function enter(n){if(!session||n>session.completed)return;stage=n;questionIndex=0;questions=makeStage(n);attempts=0;started=Date.now();intro()}
function intro(){let p=places[stage],ch=session.chapters.join(' et ');el.innerHTML='<div class="panel"><div class="eyebrow">Transmission sécurisée · professeur ZEGHOUDI</div><h1>'+p[0]+' '+p[1]+'</h1><p>« '+esc(session.first)+', bienvenue à '+p[2]+'. Ton objectif : utiliser '+esc(ch)+' pour récupérer le fragment '+(stage+1)+'. Chaque question peut demander une méthode différente. »</p><div class="note"><strong>📘 Point méthode</strong>\nLire l’énoncé entièrement. Repérer les données utiles. Écrire l’opération ou la propriété employée. Vérifier l’unité et la cohérence du résultat.\n\nExemple corrigé : une équipe achète 3 billets à 8 € et une carte à 5 €.\n3 × 8 + 5 = 24 + 5 = 29 €. On multiplie avant d’additionner.</div><p>Cette destination comprend '+questions.length+' défis variés. Le corrigé détaillé apparaît après une réponse correcte.</p><div class="actions">'+btn('Commencer les défis','ask()')+btn('Retour à la carte','map()','secondary')+'</div></div>'}
function ask(){if(questionIndex>=questions.length){complete();return}let q=questions[questionIndex];answerOptions=mix(q.opts);selected=null;let key=stage+'-'+questionIndex;el.innerHTML='<div class="panel"><div class="eyebrow">'+places[stage][1]+' · '+esc(q.type)+'</div><h2>Défi '+(questionIndex+1)+' / '+questions.length+'</h2><div class="progress"><div style="width:'+(questionIndex/questions.length*100)+'%"></div></div><div class="question">'+esc(q.t)+'</div><div class="answers">'+answerOptions.map((a,i)=>'<button id="opt'+i+'" onclick="pick('+i+')">'+esc(a)+'</button>').join('')+'</div><div id="feedback"></div><details class="note"><summary>💡 Besoin d’un indice ?</summary><p>'+esc(q.hint)+'</p></details><div class="actions">'+btn('Valider ma réponse','check()')+btn('Carte','map()','secondary')+'</div><p class="mini">Les réponses sont mélangées. Tu peux te tromper et recommencer. Le premier essai compte dans l’indicateur privé.</p></div>';attempts=0}
function pick(i){selected=i;document.querySelectorAll('.answers button').forEach((b,j)=>b.classList.toggle('selected',i===j))}
function check(){if(selected===null)return;let q=questions[questionIndex],ok=answerOptions[selected]===q.a;attempts++;session.tries++;session.lastActive=Date.now();if(ok){if(attempts===1)session.firstCorrect++;session.solved[stage+'-'+questionIndex]={attempts,chapter:session.chapters[questionIndex%session.chapters.length]};save();document.querySelectorAll('.answers button').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML='<div class="feedback">✓ Bonne réponse, '+esc(session.first)+' !<br>'+esc(q.why)+'</div><div class="actions">'+btn(questionIndex===questions.length-1?'Récupérer le fragment →':'Défi suivant →','next()','success')+'</div>'}else{save();document.getElementById('feedback').innerHTML='<div class="feedback bad">Ce n’est pas encore ça. '+esc(q.hint)+' Réessaie.</div>';selected=null;document.querySelectorAll('.answers button').forEach(b=>b.classList.remove('selected'))}}
function next(){questionIndex++;ask()}function complete(){session.completed=Math.max(session.completed,stage+1);save();el.innerHTML='<div class="panel" style="text-align:center"><div class="eyebrow">Mission accomplie · '+places[stage][2]+'</div><h1>Fragment récupéré !</h1><p>Le professeur ZEGHOUDI valide ton passage, '+esc(session.first)+'.</p><div class="digit" style="margin:20px auto;width:100px;height:110px;font-size:55px">'+digits[stage]+'</div>'+btn(stage===5?'Accéder au coffre':'Voyager vers la destination suivante',stage===5?'vault()':'map()')+'</div>'}
function vault(){el.innerHTML='<div class="panel" style="text-align:center"><h1>🔐 Le coffre final</h1><p>Assemble les six fragments dans l’ordre des destinations.</p><div class="digits">'+digits.map(x=>'<div class="digit">'+x+'</div>').join('')+'</div><input id="code" maxlength="6" inputmode="numeric" style="max-width:300px;text-align:center;font-size:26px" placeholder="Code à 6 chiffres"><div class="actions" style="justify-content:center">'+btn('Déverrouiller','unlock()')+'</div><div id="result"></div></div>'}
function unlock(){if(document.getElementById('code').value==='472916'){let n=Object.keys(session.solved).length;document.getElementById('result').innerHTML='<div class="feedback"><h2>🏆 Expédition terminée !</h2>Bravo '+esc(session.first)+' ! '+n+' défis réussis. Retour au QG du professeur ZEGHOUDI.</div>'}else document.getElementById('result').innerHTML='<div class="feedback bad">Code incorrect. Vérifie l’ordre des destinations.</div>'}
function teacher(){let n=session?Object.keys(session.solved).length:0;el.innerHTML='<div class="panel"><div class="eyebrow">Espace professeur · démonstration locale</div><h1>Poste de commandement</h1><p>Cette version est un prototype sans authentification et sans serveur. Elle ne permet pas de suivre plusieurs tablettes en direct.</p><div class="grid"><div class="tile"><strong>Élève sur cet appareil</strong>'+(session?esc(session.first+' '+session.last):'Aucun')+'</div><div class="tile"><strong>Destinations</strong>'+(session?session.completed:0)+'/6</div><div class="tile"><strong>Défis validés</strong>'+n+'</div><div class="tile"><strong>Premiers essais réussis</strong>'+(session?session.firstCorrect:0)+'</div></div><div class="actions">'+btn('📱 QR code','qr()')+btn('Exporter CSV local','csv()','secondary')+btn('Réinitialiser la démonstration','reset()','secondary')+'</div><p class="mini">Pour une véritable classe, il faudra une base de données, des codes de séance et un accès professeur protégé.</p></div>'}
function csv(){if(!session)return alert('Aucune session.');let lines=['prenom,nom,niveau,chapitres,etapes,defis,bonnes_premieres_reponses','"'+session.first+'","'+session.last+'",'+session.grade+',"'+session.chapters.join(' + ')+'",'+session.completed+','+Object.keys(session.solved).length+','+session.firstCorrect];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='expedition-z-local.csv';a.click();URL.revokeObjectURL(a.href)}
function reset(){if(confirm('Effacer la session locale ?')){session=null;localStorage.removeItem('expeditionZ_session_v2');home()}}
function qr(){let url=location.protocol==='https:'?location.origin+location.pathname:'https://fatheyze.github.io/maths-expedition/';el.innerHTML='<div class="panel"><h2>📱 Diffuser la mission</h2><label>Adresse de la mission</label><input id="url" value="'+esc(url)+'"><label>Nombre d’étiquettes</label><input id="count" type="number" min="1" max="120" value="30"><div class="actions">'+btn('Projeter le QR code','project()')+btn('Imprimer les étiquettes','printLabels()','secondary')+btn('Copier le lien','copyLink()','secondary')+'</div><div id="qrpreview"></div><p class="mini">Le QR code est commun à tous. Chaque élève saisit son nom et son prénom. Génération via un service externe, nécessitant Internet.</p></div>'}
function urlQR(){return 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=15&data='+encodeURIComponent(document.getElementById('url').value.trim())}
function project(){document.getElementById('qrpreview').innerHTML='<div class="qrcard"><h2>MATHS EXPÉDITION · PROJET Z</h2><img src="'+urlQR()+'" alt="QR code de la mission"><p>Scanne pour commencer la mission</p></div>';document.getElementById('qrpreview').scrollIntoView({behavior:'smooth'})}
function printLabels(){let n=Math.max(1,Math.min(120,Number(document.getElementById('count').value)||30)),src=urlQR();document.getElementById('printArea').innerHTML=Array.from({length:n},()=>'<div class="labelqr"><strong>MATHS EXPÉDITION</strong><br><img src="'+src+'"><br>Scanne et démarre la mission</div>').join('');let img=new Image();img.onload=()=>window.print();img.onerror=()=>alert('Le QR code ne se charge pas : vérifie Internet.');img.src=src}
function copyLink(){let u=document.getElementById('url').value;if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>alert('Lien copié')).catch(()=>prompt('Copie ce lien',u));else prompt('Copie ce lien',u)}
home();
</script></body></html>
